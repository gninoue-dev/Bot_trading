[project]
name = "goldbot"
version = "1.0.0"
description = "Bot de trading sur l'or (XAUUSD) pour MetaTrader 5 / HFM : stratégies testées, gestion du risque stricte"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
# MetaTrader5 n'existe que sur Windows (là où tourne le terminal MT5)
live = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
test = ["pytest>=8"]

[project.scripts]
goldbot = "goldbot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["goldbot*"]
